on:
  push:
    - workflows: [check]
  pull_request:
    - workflows: [check]

workflows:
  check:
    settings:
      max_cube_duration: 10m
    checkout:
      enabled: true
    tasks:
      - check

tasks:
  - name: check
    cubes:
      - name: bun-install-typecheck-test
        image: oven/bun:1
        script:
          - bun install --frozen-lockfile
          - bun run tsc
          - bun test
