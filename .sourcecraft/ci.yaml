on:
  push:
    - workflows: [check]
  pull_request:
    - workflows: [check]

workflows:
  check:
    settings:
      max_cube_duration: 10m
    checkout:
      enabled: true
    tasks:
      - check

tasks:
  - name: check
    cubes:
      - name: bun-install-typecheck-test
        # oven/bun с Docker Hub через зеркало Google: раннер упирался в лимит
        # анонимных скачиваний Docker Hub (toomanyrequests), digest тот же
        image: mirror.gcr.io/oven/bun:1.4.2
        script:
          - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates
          - bun install --frozen-lockfile
          - bun run tsc
          # временные БД тестов в /dev/shm, лимит теста 30 с – см. скрипт
          - sh scripts/ci-test.sh
