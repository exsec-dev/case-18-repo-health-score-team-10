on:
  push:
    - workflows: [check]
  pull_request:
    - workflows: [check]

workflows:
  check:
    settings:
      max_cube_duration: 10m
    checkout:
      enabled: true
    tasks:
      - check

tasks:
  - name: check
    cubes:
      - name: bun-install-typecheck-test
        image: oven/bun:1.4.2
        script:
          - apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates
          - bun install --frozen-lockfile
          - bun run tsc
          # лимит теста 30 с: на раннере тесты с временной БД идут 4-7 с, дефолтные 5 с дают флаки; зависание все равно ловит max_cube_duration
          - bun test --timeout 30000
