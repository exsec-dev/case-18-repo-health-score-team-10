on:
  push:
    - workflows: [build-and-push]
      filter:
        tags: ["v*"]
    - workflows: [build-and-push-trivy]
      filter:
        tags: ["trivy-v*"]
  schedule:
    - workflows: [vulnerability-scan]
      cron: "0 3 * * *"
      description: Daily Trivy scan for the published Dozzle Plus image
    - workflows: [upstream-release-check]
      cron: "0 4 * * *"
      description: Daily check for new upstream Dozzle releases

tokens:
  SERVICE_CONNECTION:
    service_connection: default-service-connection
    scope: repo

workflows:
  build-preview:
    inputs:
      preview_tag:
        type: string
        required: true
        default: v1.3-preview
        description: "Docker tag and application version for the preview image."
      core_version:
        type: string
        required: true
        default: v10.8.0
        description: "Dozzle Core version on which this preview is based."
    tasks:
      - name: publish-dozzle-plus-preview
        env:
          PREVIEW_TAG: ${{ inputs.preview_tag }}
          CORE_VERSION: ${{ inputs.core_version }}
        cubes:
          - name: validate-preview-version
            image: alpine:3.23
            script:
              - |
                validate_numeric_segments() {
                  value=$1
                  min_segments=$2
                  max_segments=$3
                  case "$value" in
                    ""|.*|*.|*..*) return 1 ;;
                  esac
                  previous_ifs=$IFS
                  IFS=.
                  set -- $value
                  IFS=$previous_ifs
                  [ "$#" -ge "$min_segments" ] && [ "$#" -le "$max_segments" ] || return 1
                  for segment in "$@"; do
                    [ -n "$segment" ] || return 1
                    case "$segment" in
                      *[!0-9]*) return 1 ;;
                    esac
                  done
                }
                case "$PREVIEW_TAG" in
                  v*-preview)
                    PREVIEW_VERSION=${PREVIEW_TAG#v}
                    PREVIEW_VERSION=${PREVIEW_VERSION%-preview}
                    validate_numeric_segments "$PREVIEW_VERSION" 2 3 || {
                      echo "Preview tag must contain two or three numeric version segments" >&2
                      exit 1
                    }
                    ;;
                  *) echo "Preview tag must match v<version>-preview" >&2; exit 1 ;;
                esac
                case "$PREVIEW_TAG" in
                  *[!a-zA-Z0-9_.-]*) echo "Preview tag contains invalid characters" >&2; exit 1 ;;
                esac
                case "$CORE_VERSION" in
                  v*)
                    validate_numeric_segments "${CORE_VERSION#v}" 3 3 || {
                      echo "Core version must contain exactly three numeric segments" >&2
                      exit 1
                    }
                    ;;
                  *) echo "Core version must match v<major>.<minor>.<patch>" >&2; exit 1 ;;
                esac

          - name: build-preview-frontend
            image: node:25.9.0-alpine
            script:
              - npm install --global pnpm@10.33.0
              - pnpm install --frozen-lockfile
              - |
                VERSION_WITHOUT_V=${PREVIEW_TAG#v}
                BASE_VERSION=${VERSION_WITHOUT_V%-preview}
                case "$BASE_VERSION" in
                  *.*.*) PACKAGE_VERSION="${BASE_VERSION}-preview.0" ;;
                  *.*) PACKAGE_VERSION="${BASE_VERSION}.0-preview.0" ;;
                  *) echo "Preview version must contain major and minor numbers" >&2; exit 1 ;;
                esac
                CURRENT_PACKAGE_VERSION=$(node --print "require('./package.json').version")
                if [ "$CURRENT_PACKAGE_VERSION" != "$PACKAGE_VERSION" ]; then
                  pnpm version "$PACKAGE_VERSION" --no-git-tag-version
                fi
              - pnpm build

          - name: prepare-preview-certificates
            env:
              SHARED_KEY: ${{ secrets.TTL_KEY }}
              SHARED_CERT: ${{ secrets.TTL_CERT }}
            image: alpine:3.23
            script:
              - printf '%s\n' "$SHARED_KEY" > shared_key.pem
              - printf '%s\n' "$SHARED_CERT" > shared_cert.pem
              - test -s shared_key.pem
              - test -s shared_cert.pem

          - name: get-preview-iam-token
            env:
              ID_TOKEN: ${{ tokens.SERVICE_CONNECTION.id_token }}
              YC_SA_ID: ${{ tokens.SERVICE_CONNECTION.service_account_id }}
            image: cr.yandex/sourcecraft/yc-iam:latest

          - name: setup-preview-buildx
            action: docker/setup-buildx-action@v3.11.1

          - name: login-preview-yandex-registry
            action: docker/login-action@v3.5.0
            with:
              registry: registry.yandexcloud.net
              username: iam
              password: ${{ cubes.get-preview-iam-token.outputs.IAM_TOKEN }}

          - name: build-and-push-dozzle-plus-preview
            action: docker/build-push-action@v6.18.0
            with:
              context: .
              file: Dockerfile
              platforms: linux/amd64
              build-args: |
                TAG=${{ inputs.preview_tag }}
                CORE_VERSION=${{ inputs.core_version }}
                DOZZLE_SOURCECRAFT_TOKEN=${{ secrets.DOZZLE_SOURCECRAFT_TOKEN }}
              tags: registry.yandexcloud.net/cn1f8ou8bj00s0u25qqe/dozzle-plus:${{ inputs.preview_tag }}
              provenance: false
              sbom: false
              push: true

  build-and-push:
    tasks:
      - name: publish-dozzle-plus-image
        cubes:
          - name: build-frontend
            image: node:25.9.0-alpine
            script:
              - npm install --global pnpm@10.33.0
              - pnpm install --frozen-lockfile
              - |
                PACKAGE_VERSION=${SOURCECRAFT_COMMIT_REF_NAME#v}
                case "$PACKAGE_VERSION" in
                  *.*.*) ;;
                  *.*) PACKAGE_VERSION="${PACKAGE_VERSION}.0" ;;
                  *) PACKAGE_VERSION="${PACKAGE_VERSION}.0.0" ;;
                esac
                CURRENT_PACKAGE_VERSION=$(node --print "require('./package.json').version")
                if [ "$CURRENT_PACKAGE_VERSION" != "$PACKAGE_VERSION" ]; then
                  pnpm version "$PACKAGE_VERSION" --no-git-tag-version
                fi
              - pnpm build

          - name: prepare-certificates
            env:
              SHARED_KEY: ${{ secrets.TTL_KEY }}
              SHARED_CERT: ${{ secrets.TTL_CERT }}
            image: alpine:3.23
            script:
              - printf '%s\n' "$SHARED_KEY" > shared_key.pem
              - printf '%s\n' "$SHARED_CERT" > shared_cert.pem
              - test -s shared_key.pem
              - test -s shared_cert.pem

          - name: get-iam-token
            env:
              ID_TOKEN: ${{ tokens.SERVICE_CONNECTION.id_token }}
              YC_SA_ID: ${{ tokens.SERVICE_CONNECTION.service_account_id }}
            image: cr.yandex/sourcecraft/yc-iam:latest

          - name: setup-buildx
            action: docker/setup-buildx-action@v3.11.1

          - name: login-yandex-registry
            action: docker/login-action@v3.5.0
            with:
              registry: registry.yandexcloud.net
              username: iam
              password: ${{ cubes.get-iam-token.outputs.IAM_TOKEN }}

          - name: build-and-push-dozzle-plus
            action: docker/build-push-action@v6.18.0
            with:
              context: .
              file: Dockerfile
              platforms: linux/amd64
              build-args: |
                TAG=${{ env.SOURCECRAFT_COMMIT_REF_NAME }}
                CORE_VERSION=v10.8.0
                DOZZLE_SOURCECRAFT_TOKEN=${{ secrets.DOZZLE_READONLY_PUBLICKEY }}
              tags: |
                registry.yandexcloud.net/cn1f8ou8bj00s0u25qqe/dozzle-plus:latest
                registry.yandexcloud.net/cn1f8ou8bj00s0u25qqe/dozzle-plus:${{ env.SOURCECRAFT_COMMIT_REF_NAME }}
              provenance: false
              sbom: false
              push: true

  build-and-push-trivy:
    inputs:
      trivy_tag:
        type: string
        required: true
        default: trivy-v1.3.0
        description: "Docker tag for the Trivy image, for example trivy-v1.3.0."
    tasks:
      - name: publish-dozzle-plus-trivy-image
        env:
          TRIVY_TAG: ${{ inputs.trivy_tag }}
        cubes:
          - name: build-trivy-frontend
            image: node:25.9.0-alpine
            script:
              - npm install --global pnpm@10.33.0
              - pnpm install --frozen-lockfile
              - |
                case "$TRIVY_TAG" in
                  trivy-v*) PACKAGE_VERSION=${TRIVY_TAG#trivy-v} ;;
                  v*) PACKAGE_VERSION=${TRIVY_TAG#v} ;;
                  [0-9]*) PACKAGE_VERSION=$TRIVY_TAG ;;
                  *) echo "Trivy tag must be a version such as 1.3.0, v1.3.0, or trivy-v1.3.0" >&2; exit 1 ;;
                esac
                case "$PACKAGE_VERSION" in
                  *.*.*) ;;
                  *.*) PACKAGE_VERSION="${PACKAGE_VERSION}.0" ;;
                  *) PACKAGE_VERSION="${PACKAGE_VERSION}.0.0" ;;
                esac
                case "$PACKAGE_VERSION" in
                  *[!0-9A-Za-z.+-]*) echo "Trivy package version contains invalid characters" >&2; exit 1 ;;
                esac
                CURRENT_PACKAGE_VERSION=$(node --print "require('./package.json').version")
                if [ "$CURRENT_PACKAGE_VERSION" != "$PACKAGE_VERSION" ]; then
                  pnpm version "$PACKAGE_VERSION" --no-git-tag-version
                fi
              - pnpm build

          - name: prepare-trivy-certificates
            env:
              SHARED_KEY: ${{ secrets.TTL_KEY }}
              SHARED_CERT: ${{ secrets.TTL_CERT }}
            image: alpine:3.23
            script:
              - printf '%s\n' "$SHARED_KEY" > shared_key.pem
              - printf '%s\n' "$SHARED_CERT" > shared_cert.pem
              - test -s shared_key.pem
              - test -s shared_cert.pem

          - name: get-trivy-iam-token
            env:
              ID_TOKEN: ${{ tokens.SERVICE_CONNECTION.id_token }}
              YC_SA_ID: ${{ tokens.SERVICE_CONNECTION.service_account_id }}
            image: cr.yandex/sourcecraft/yc-iam:latest

          - name: setup-trivy-buildx
            action: docker/setup-buildx-action@v3.11.1

          - name: login-trivy-yandex-registry
            action: docker/login-action@v3.5.0
            with:
              registry: registry.yandexcloud.net
              username: iam
              password: ${{ cubes.get-trivy-iam-token.outputs.IAM_TOKEN }}

          - name: build-and-push-trivy
            action: docker/build-push-action@v6.18.0
            with:
              context: .
              file: Dockerfile.trivy
              platforms: linux/amd64
              build-args: |
                TAG=${{ inputs.trivy_tag }}
                CORE_VERSION=v10.8.0
              tags: |
                registry.yandexcloud.net/cn1f8ou8bj00s0u25qqe/dozzle-plus-trivy:latest
                registry.yandexcloud.net/cn1f8ou8bj00s0u25qqe/dozzle-plus-trivy:${{ inputs.trivy_tag }}
              provenance: false
              sbom: false
              push: true

  vulnerability-scan:
    tasks:
      - name: vulnerability-scan-task
        cubes:
          - name: get-iam-token
            env:
              ID_TOKEN: ${{ tokens.SERVICE_CONNECTION.id_token }}
              YC_SA_ID: ${{ tokens.SERVICE_CONNECTION.service_account_id }}
            image: cr.yandex/sourcecraft/yc-iam:latest

          - name: trivy-scan-and-create-issues
            env:
              TRIVY_USERNAME: iam
              TRIVY_PASSWORD: ${{ cubes.get-iam-token.outputs.IAM_TOKEN }}
              TRIVY_IMAGE_REF: registry.yandexcloud.net/cn1f8ou8bj00s0u25qqe/dozzle-plus:latest
              PAT: ${{ secrets.PAT }}
              SOURCECRAFT_ORG: k-5-45mm
              SOURCECRAFT_REPO: dozzle-plus
              TRIVY_ISSUE_MAX_CREATE: "20"
            image:
              name: aquasec/trivy:0.70.0
              entrypoint: ""
            script:
              - apk add --no-cache curl jq coreutils
              - trivy image --quiet --format json --output trivy-report.json --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore.yaml "${TRIVY_IMAGE_REF}"
              - sh scripts/sourcecraft-trivy-issues.sh
            artifacts:
              paths:
                - trivy-report.json

  upstream-release-check:
    tasks:
      - name: upstream-release-check-task
        cubes:
          - name: check-dozzle-release-and-create-issue
            env:
              PAT: ${{ secrets.PAT }}
              SOURCECRAFT_ORG: k-5-45mm
              SOURCECRAFT_REPO: dozzle-plus
              UPSTREAM_REPOSITORY: amir20/dozzle
            image: alpine:3.23
            script:
              - apk add --no-cache curl jq coreutils
              - sh scripts/sourcecraft-upstream-release.sh
