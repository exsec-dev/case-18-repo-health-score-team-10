# HealthCraft – демо: /healthcraft → Bun на 127.0.0.1:8418 (deploy/demo/healthcraft-demo.service).
# Подключается в server{} сайта exsec.dev: include snippets/healthcraft.conf;
# Путь передается как есть: сервис сам отвечает под /healthcraft (BASE_PATH).
location = /healthcraft {
    return 301 /healthcraft/;
}

location ^~ /healthcraft/ {
    proxy_pass http://127.0.0.1:8418;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # заголовки защиты ставит сайт: свои копии сервиса не дублируем
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
}
