# HealthCraft – стенд: два процесса сервиса на одной SQLite + прокси с HTTPS.
#
#   web    – сайт и API, пользовательские сканы, AI-обзоры и проверки
#   rating – обход каталога, плановые сканы рейтинга, стартовый пересчет, AI топа
#   caddy  – HTTPS (Let's Encrypt), заголовки защиты, X-Forwarded-For = адрес клиента
#
# Каталог стенда HC_DIR (по умолчанию /srv/healthcraft): .env (секреты), data/ (БД),
# tmp/ (клоны). Запуск: deploy/deploy.sh или `docker compose -f deploy/compose.yaml up -d --build`.
# Наружу опубликован только caddy (80/443); порты сервиса доступны лишь внутри сети compose.
name: healthcraft

x-service: &service
  build:
    context: ..
    dockerfile: Dockerfile
  image: healthcraft:latest
  restart: unless-stopped
  init: true              # tini как PID 1: реапит осиротевшие git-процессы клонов
  stop_grace_period: 30s  # SIGTERM: заявки возвращаются в очередь, клоны гасятся
  env_file:
    - path: ${HC_DIR:-/srv/healthcraft}/.env
      required: false
  # процесс работает от bun (uid 1000) без root и без capabilities: git, bun и SQLite
  # их не требуют; повышение привилегий внутри контейнера запрещено
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  web:
    <<: *service
    environment:
      PROCESS_ROLE: web
      PORT: "8418"
      # резерв свободного места перед клоном: места меньше – клон ждет, пока соседи освободят диск
      SCAN_MIN_FREE_MB: "4096"
    volumes:
      - ${HC_DIR:-/srv/healthcraft}/data:/data
      - ${HC_DIR:-/srv/healthcraft}/tmp/web:/tmp/clones
    # Проверка живости процесса, а не состояния сервиса: /api/health отвечает 200 и при
    # "ok": false, и контейнер остается healthy. Так задумано – ok бывает false и у живого
    # процесса (пересчет оценок после смены модели, сбой обхода каталога, нет токена), и
    # перезапуск контейнера это не лечит, а прерывает пересчет и заявки. Кроме того, rating
    # стартует только после healthy web, а ok у web зависит от работы rating (пересчет,
    # тики планировщика): проверка по ok не дала бы rating запуститься. Работу очередей,
    # обхода и пересчета показывает поле ok в теле ответа – за ним следит мониторинг.
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8418/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  rating:
    <<: *service
    environment:
      PROCESS_ROLE: rating
      PORT: "8419"
      SCAN_MIN_FREE_MB: "4096"
    # после web: при одновременном старте оба процесса проверяют схему БД в транзакции,
    # и второй получает SQLITE_BUSY
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ${HC_DIR:-/srv/healthcraft}/data:/data
      - ${HC_DIR:-/srv/healthcraft}/tmp/rating:/tmp/clones
    # фон уступает процессор сайту и пользовательским заявкам (дефолт – 1024)
    cpu_shares: 256
    # та же проверка живости, что у web, на порту роли
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8419/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      - web
    # единственная нужная capability – привязка к портам 80/443
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    # живость процесса Caddy: его admin API на localhost:2019 внутри контейнера
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    # порты опубликованы на всех интерфейсах намеренно: это единственный контейнер наружу
    ports:
      # на стенде 80/443; локально, если 80 занят, – HTTP_PORT=8080
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      # домен стенда (HTTPS выпускается сам) или ":80" – только HTTP, пока домена нет
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # основной хост (без него – переадресации нет); пусто в режиме ":80"
      CANONICAL_HOST: ${CANONICAL_HOST:-}
      # IP стенда: http://IP → https://CANONICAL_HOST (только вместе с CANONICAL_HOST).
      # Пусто – заглушка .invalid (та же, что в Caddyfile): такого Host не бывает, блок не мешает
      STAND_IP: ${STAND_IP:-stand-ip.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
